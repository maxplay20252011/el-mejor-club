<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volvete Dirigente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e13;--panel:#171b22;--panel2:#1e2430;--line:#2a3140;--gold:#d8b45a;--text:#e8e4d8;--mut:#9aa3b2;--ok:#3ddc84;--bad:#e5534b;--acc:#4fb5e0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;}
h1,h2{font-family:Unbounded,Inter,sans-serif;margin:8px 0;line-height:1.2;}
h1{font-size:1.7rem;color:var(--gold);} h2{font-size:1.15rem;}
.mut{color:var(--mut);font-size:.82rem;} .center{text-align:center;} .grow{flex:1;text-align:left;}
.screen{display:flex;flex-direction:column;gap:10px;}
.screen.center{align-items:center;text-align:center;}
.logo{font-size:3.4rem;margin-top:20px;}
.btn{font:700 .95rem Inter,sans-serif;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;width:100%;}
.btn.primary{background:linear-gradient(135deg,#f0d98a,var(--gold) 60%,#a8790a);color:#241a00;border:none;}
.btn.ghost{background:transparent;} .btn.sm{padding:8px 12px;font-size:.8rem;width:auto;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.top{display:flex;align-items:center;gap:10px;} .top h2{margin:0;}
.tabs{display:flex;gap:6px;} .tabs .tab{flex:1;background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:9px;font:700 .82rem Inter;cursor:pointer;}
.tabs .tab.on{background:var(--gold);color:#241a00;border-color:var(--gold);} .tabs.sm .tab{font-size:.74rem;padding:7px 6px;}
.list{display:flex;flex-direction:column;gap:8px;}
.club-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--text);cursor:pointer;text-align:left;font:inherit;width:100%;}
.club-card.static{cursor:default;flex-wrap:wrap;} .club-card.dim{opacity:.55;}
.mini{font:500 .75rem 'JetBrains Mono',monospace;color:var(--mut);margin-top:3px;}
.crest svg{width:100%;height:auto;display:block;} .crest.sm{width:62px;flex:none;} .crest.lg{width:min(220px,60vw);margin:0 auto;}
.label{font:700 .72rem Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:10px;}
.in,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;} .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;} .row4 .btn{padding:8px 4px;font-size:.72rem;}
.tabla{display:flex;flex-direction:column;gap:3px;width:100%;} .trow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:7px 10px;font-size:.86rem;text-align:left;border-left:4px solid transparent;} .trow .tn{flex:1;} .trow .tp{width:22px;color:var(--mut);font:700 .8rem 'JetBrains Mono',monospace;} .trow.yo{background:#2a2412;outline:1px solid var(--gold);} .trow.campeon{border-left-color:var(--gold);} .trow.copa{border-left-color:#4fb5e0;} .trow.descenso{border-left-color:var(--bad);} h3.sub{margin:10px 0 0;font:700 .9rem Inter;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;}
.paises{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.pais{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 9px;font:inherit;font-size:.8rem;cursor:pointer;} .pais.on{border-color:var(--gold);color:var(--gold);}
.shapes{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;} .shape{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;} .shape.on{border-color:var(--gold);}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0;} .sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;} .sw.on{border-color:#fff;} .sw.off{opacity:.2;cursor:not-allowed;}
.cargas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:260px;overflow:auto;} .carga{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:6px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;} .carga span{font-size:.68rem;text-align:center;} .carga.on{border-color:var(--gold);} .carga svg{width:100%;height:56px;}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2;}
.aviso{display:none;background:#2a1a10;border:1px solid #e07a1f;color:#ffcf9a;border-radius:10px;padding:9px 12px;font-size:.82rem;} .aviso.show{display:block;}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;} .hud-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;transition:background .3s;}
.hud-cell.up{background:#123a24;} .hud-cell.down{background:#3d1818;} .hud-v{font:700 1.05rem 'JetBrains Mono',monospace;} .hud-v.neg{color:var(--bad);} .hud-l{font-size:.62rem;color:var(--mut);}
.progress{height:5px;background:var(--panel2);border-radius:5px;overflow:hidden;} .progress div{height:100%;background:var(--gold);}
.ctx{font-size:1rem;line-height:1.5;margin:4px 0;}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);cursor:pointer;font:inherit;} .opt:active{background:var(--panel2);} .opt b{font-size:.98rem;} .opt span{font-size:.8rem;color:var(--mut);}
.player-chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex:1;}
.player-avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#241a00;display:flex;align-items:center;justify-content:center;font:800 .95rem 'JetBrains Mono',monospace;flex:none;}
.badge{display:inline-block;background:#232a38;border:1px solid #37425a;border-radius:20px;padding:1px 8px;font-size:.68rem;color:var(--gold);} .badge.on{background:var(--gold);color:#241a00;}
.tags{margin-left:auto;display:flex;gap:4px;} .buy{margin-left:auto;display:flex;align-items:center;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;} .chip{font:700 .9rem 'JetBrains Mono',monospace;padding:6px 10px;border-radius:20px;} .chip.pos{background:#123a24;color:var(--ok);} .chip.neg{background:#3d1818;color:var(--bad);}
.nota{background:var(--panel);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:.85rem;}
.reac{display:flex;justify-content:center;gap:34px;margin:6px 0;} .reac div{display:flex;flex-direction:column;align-items:center;} .reac span{font-size:2.6rem;} .reac small{color:var(--mut);font-size:.72rem;}
.pitch{position:relative;width:100%;aspect-ratio:3/4;background:linear-gradient(#1E5631,#1a4a2a);border:3px solid #e8e4d8;border-radius:12px;} .pitch::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff55;}
.slot{position:absolute;transform:translate(-50%,-50%);background:none;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;} .slot small{font-size:.65rem;text-shadow:0 1px 2px #000;} .slot.sel .player-avatar{outline:3px solid #fff;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;}
.big{font:800 2.6rem 'JetBrains Mono',monospace;color:var(--gold);}
.diario{background:#e8dfc8;color:#1b1710;border-radius:6px;padding:16px;font-family:Georgia,serif;} .diario .cab{font-weight:900;letter-spacing:.18em;text-align:center;border-bottom:3px double #1b1710;padding-bottom:8px;margin-bottom:10px;font-size:1.05rem;} .diario .tit{font-weight:700;font-size:1.05rem;line-height:1.3;padding:9px 0;border-bottom:1px solid #b9ae92;} .diario .tit.bien span{color:#1d7a3a;} .diario .tit.mal span{color:#b3261e;}
.verd{font-size:1.5rem;} .final-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;} .final-stats div{background:var(--panel);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;} .final-stats b{font:800 1.05rem 'JetBrains Mono';} .final-stats small{color:var(--mut);font-size:.62rem;}
.foot{font-size:.68rem;color:#6b7385;text-align:center;line-height:1.5;margin-top:14px;}
.tag{font-style:normal;font-size:.68rem;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:4px;color:var(--mut);white-space:nowrap;}
.logros{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;} .logro{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;} .logro span{font-size:1.5rem;} .logro small{display:block;color:var(--mut);font-size:.72rem;}
.hist{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.8rem;display:flex;flex-direction:column;gap:4px;} .hrow{display:flex;justify-content:space-between;gap:8px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*SCRIPTS*/
</script>
</body>
</html>
