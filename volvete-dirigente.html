<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;}
h1,h2{font-family:Unbounded,Inter,sans-serif;margin:8px 0;line-height:1.2;}
h1{font-size:1.7rem;color:var(--gold);} h2{font-size:1.15rem;}
.mut{color:var(--mut);font-size:.82rem;} .center{text-align:center;} .grow{flex:1;text-align:left;}
.screen{display:flex;flex-direction:column;gap:10px;}
.screen.center{align-items:center;text-align:center;}
.logo{font-size:3.4rem;margin-top:20px;}
.btn{font:700 .95rem Inter,sans-serif;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;width:100%;}
.btn.primary{background:linear-gradient(135deg,#f0d98a,var(--gold) 60%,#a8790a);color:#241a00;border:none;}
.btn.ghost{background:transparent;} .btn.sm{padding:8px 12px;font-size:.8rem;width:auto;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.top{display:flex;align-items:center;gap:10px;} .top h2{margin:0;}
.tabs{display:flex;gap:6px;} .tabs .tab{flex:1;background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:9px;font:700 .82rem Inter;cursor:pointer;}

.list{display:flex;flex-direction:column;gap:8px;}
.club-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--text);cursor:pointer;text-align:left;font:inherit;width:100%;}

.mini{font:500 .75rem 'JetBrains Mono',monospace;color:var(--mut);margin-top:3px;}

.in,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;}

.paises{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.pais{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 9px;font:inherit;font-size:.8rem;cursor:pointer;} .pais.on{border-color:var(--gold);color:var(--gold);}

.preview{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2;}

.progress{height:5px;background:var(--panel2);border-radius:5px;overflow:hidden;} .progress div{height:100%;background:var(--gold);}
.ctx{font-size:1rem;line-height:1.5;margin:4px 0;}

.badge{display:inline-block;background:#232a38;border:1px solid #37425a;border-radius:20px;padding:1px 8px;font-size:.68rem;color:var(--gold);} .badge.on{background:var(--gold);color:#241a00;}
.tags{margin-left:auto;display:flex;gap:4px;} .buy{margin-left:auto;display:flex;align-items:center;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;} .chip{font:700 .9rem 'JetBrains Mono',monospace;padding:6px 10px;border-radius:20px;} .chip.pos{background:#123a24;color:var(--ok);} .chip.neg{background:#3d1818;color:var(--bad);}
.nota{background:var(--panel);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:.85rem;}

.big{font:800 2.6rem 'JetBrains Mono',monospace;color:var(--gold);}
.diario{background:#e8dfc8;color:#1b1710;border-radius:6px;padding:16px;font-family:Georgia,serif;} .diario .cab{font-weight:900;letter-spacing:.18em;text-align:center;border-bottom:3px double #1b1710;padding-bottom:8px;margin-bottom:10px;font-size:1.05rem;} .diario .tit{font-weight:700;font-size:1.05rem;line-height:1.3;padding:9px 0;border-bottom:1px solid #b9ae92;} .diario .tit.bien span{color:#1d7a3a;} .diario .tit.mal span{color:#b3261e;}

.logros{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;} .logro{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;} .logro span{font-size:1.5rem;} .logro small{display:block;color:var(--mut);font-size:.72rem;}

</style>
</head>

<script>
/* ===== paises.js ===== */

/* ===================== Expansión ===================== */

const _sub = (s, vars) => (s == null ? s : String(s).replace(/\{([A-Z_]+)\}/g, (m, k) => (k in vars ? vars[k] : m)));

const _instanciarRama = (r, vars) => {
  const o = { d: Object.assign({}, r.d), msg: _sub(r.msg, vars) };
  if (r.vende) o.vende = true;
  if (r.ficha) o.ficha = true;
  return o;
};

const _instanciarOpcion = (op, vars) => {
  const o = { texto: _sub(op.texto, vars), sub: _sub(op.sub, vars) };
  if (op.setea) o.setea = op.setea;
  if (op.azar) {
    o.azar = { p: op.azar.p, ok: _instanciarRama(op.azar.ok, vars), mal: _instanciarRama(op.azar.mal, vars) };
  } else {
    Object.assign(o, _instanciarRama(op, vars));
  }
  return o;
};

/* ---- ninguna opción puede ser claramente la correcta ----
   Si una opción es igual o mejor en todo (esperanza de gestión, prensa, resultado, caja y vestuario),
   la otra gana ahorro de caja: hacer menos o no actuar cuesta menos plata. */
const _DIMS = ['gestion', 'prensa', 'resultado', 'caja', 'vestuario'];
const _ramas = (o) => (o.azar ? [o.azar.ok.d, o.azar.mal.d] : [o.d]);
const esperadoOpcion = (o) => {
  const p = o.azar ? o.azar.p : 1, w = o.azar ? [p, 1 - p] : [1];
  const e = {};
  _DIMS.forEach(k => { e[k] = _ramas(o).reduce((a, d, i) => a + ((d && d[k]) || 0) * w[i], 0); });
  return e;
};
const _vec = (e) => [e.gestion, e.prensa, e.resultado, e.caja / 60, e.vestuario];
const dominaOpcion = (a, b) => {
  const x = _vec(esperadoOpcion(a)), y = _vec(esperadoOpcion(b));
  return x.every((v, i) => v >= y[i]) && x.some((v, i) => v > y[i]);
};
const equilibrarOpciones = (ops) => {
  for (let vuelta = 0; vuelta < 5; vuelta++) {
    let cambio = false;
    for (const b of ops) {
      if (!ops.some(a => a !== b && dominaOpcion(a, b))) continue;
      _ramas(b).forEach(d => { d.caja = (d.caja || 0) + 45; });
      cambio = true;
    }
    if (!cambio) break;
  }
  return ops;
};

const expandirPlantillas = (plantillas) => {
  const out = [];
  for (const p of plantillas) {
    const keys = Object.keys(p.variables || {});
    let combos = [{}];
    for (const k of keys) {
      const next = [];
      for (const c of combos) for (const v of p.variables[k]) next.push(Object.assign({}, c, { [k]: v }));
      combos = next;
    }
    if (combos.length > 14) {
      const n = combos.length, pick = [];
      for (let i = 0; i < 14; i++) pick.push(combos[Math.floor(i * n / 14)]);
      combos = pick;
    }
    combos.forEach((vars, i) => {
      const ev = {
        id: p.id + '#' + i, plantilla: p.id, cat: p.cat, jugador: p.jugador,
        titulo: _sub(p.titulo, vars), contexto: _sub(p.contexto, vars),
        opciones: equilibrarOpciones(p.opciones.map(op => _instanciarOpcion(op, vars))),
      };
      if (p.requiere) ev.requiere = p.requiere;
      if (p.cond) ev.cond = p.cond;
      out.push(ev);
    });
  }
  return out;
};

const auditarEventos = (evs) => {
  const permitidos = ['JUGADOR', 'JPOS', 'JEDAD', 'JRATING', 'CLUB', 'CIUDAD'];
  const porCat = {}, ids = {}, textos = {}, desconocidos = [], idsDuplicados = [], pocasOpciones = [], opcionesInvalidas = [], textosDuplicados = [];
  let conJugador = 0;
  const flagsSetea = new Set(), flagsRequiere = new Set();
  const revisar = (ev, s) => {
    if (s == null) return;
    (String(s).match(/\{[A-Z_]+\}/g) || []).forEach(t => {
      const n = t.slice(1, -1);
      const ok = permitidos.includes(n) || (n === 'CUALIDAD' && ev.jugador === 'cualidad:*');
      if (!ok) desconocidos.push(ev.id + ' ' + t);
    });
  };
  for (const ev of evs) {
    porCat[ev.cat] = (porCat[ev.cat] || 0) + 1;
    if (ev.jugador) conJugador++;
    if (ids[ev.id]) idsDuplicados.push(ev.id);
    ids[ev.id] = 1;
    const clave = ev.titulo + '|' + ev.contexto;
    if (textos[clave]) textosDuplicados.push(ev.id);
    textos[clave] = 1;
    if (!ev.opciones || ev.opciones.length < 2) pocasOpciones.push(ev.id);
    if (ev.requiere) flagsRequiere.add(ev.requiere);
    revisar(ev, ev.titulo); revisar(ev, ev.contexto);
    for (const op of ev.opciones || []) {
      revisar(ev, op.texto); revisar(ev, op.sub);
      if (op.setea) flagsSetea.add(op.setea);
      if (op.azar) { revisar(ev, op.azar.ok.msg); revisar(ev, op.azar.mal.msg); if (!op.azar.ok.d || !op.azar.mal.d) opcionesInvalidas.push(ev.id); }
      else { revisar(ev, op.msg); if (!op.d) opcionesInvalidas.push(ev.id); }
    }
  }
  return {
    total: evs.length, porCat, conJugador, ratioConJugador: +(conJugador / evs.length).toFixed(3),
    idsDuplicados, textosDuplicados, pocasOpciones, opcionesInvalidas, tokensDesconocidos: desconocidos,
    cadenas: { setea: [...flagsSetea], requiere: [...flagsRequiere] },
  };
};

/* ---- símbolos por país: id de carga = 'sym:CODE:id' ---- */
function simboloPorChargeId(chargeId){
  if(typeof chargeId !== 'string' || chargeId.indexOf('sym:') !== 0) return null;
  const [, code, id] = chargeId.split(':');
  const lista = (typeof SIMBOLOS_POR_PAIS !== 'undefined' && SIMBOLOS_POR_PAIS[code]) || [];
  return lista.find(s => s.id === id) || null;
}
function chargeLabel(chargeId){
  const s = simboloPorChargeId(chargeId);
  return s ? s.nombre : (CHARGE_LABEL[chargeId] || chargeId);
}
function cargasSugeridasPorPais(code){
  const lista = (typeof SIMBOLOS_POR_PAIS !== 'undefined' && SIMBOLOS_POR_PAIS[code]) || [];
  return lista.map(s => ({ id:'sym:'+code+':'+s.id, nombre:s.nombre, categoria:s.categoria, verificado:s.verificado }));
}

  logo_mascota: { shapes:{ovalo:4, circulo:4}, ordinaryForzadoNinguna:true },
};
function paisPorCode(code){ return (typeof PAISES !== 'undefined') ? PAISES.find(p => p.code === code) : null; }
function tieneTag(pais, tag){ return (pais.geoTag||[]).includes(tag) || (pais.culturalTag||[]).includes(tag); }
function elegirTemaPorPais(code){
  const pais = paisPorCode(code);
  if(!pais) return null;
  if(tieneTag(pais,'sudamerica')) return 'argentino_clasico';
  if(tieneTag(pais,'costero') || tieneTag(pais,'portuario') || tieneTag(pais,'pesquero')) return 'portuario_obrero';
  if(tieneTag(pais,'rural') || tieneTag(pais,'agropecuario')) return 'provincial_rural';
  if(tieneTag(pais,'tradicion_britanica')) return 'retro_con_lema';
  if(tieneTag(pais,'norteamerica') || tieneTag(pais,'caribe')) return 'logo_mascota';
  return null;
}
function pesarCatalogoPorTema(code){
  const temaId = elegirTemaPorPais(code);
  return { temaId, pesos: temaId ? TEMAS[temaId] : null };
}

const BLOQUEO_MANUAL = [
  { ordinariaId:'banda', campo:'plata', ordinariaTintura:'rojo', motivo:'banda roja sobre blanco' },
  { cargaId:'monograma', campo:'azul', ordinariaId:'faja', ordinariaTintura:'oro', motivo:'monograma azul y oro con faja' },
];
function generarBloqueoDesdeClubes(lista){
  const vistos = new Set();
  const out = [];
  lista.forEach(([nombre, p, s]) => {
    const k = p + '/' + s;
    if(vistos.has(k)) return;
    vistos.add(k);
    out.push({ campo:p, secundarioEnFranja:s, motivo:'colores de ' + nombre + ' (uso interno)' });
  });
  return out;
}
const BLOQUEO_IDENTIDAD = [
  ...BLOQUEO_MANUAL,
  ...generarBloqueoDesdeClubes(REAL_COLORES.filter(c => c[0] !== 'River Plate' && c[0] !== 'Boca Juniors')),
];
function matchesBloqueo(crest, lista){
  return (lista || BLOQUEO_IDENTIDAD).some(r => {
    if(r.ordinariaId && crest.ordinaryId !== r.ordinariaId) return false;
    if(r.campo && crest.fieldTincture !== r.campo) return false;
    if(r.ordinariaTintura && crest.ordinaryTincture !== r.ordinariaTintura) return false;
    if(r.cargaId && crest.chargeId !== r.cargaId) return false;
    if(r.secundarioEnFranja){
      if(!ORDINARIAS_FRANJA.includes(crest.ordinaryId)) return false;
      if(crest.ordinaryTincture !== r.secundarioEnFranja) return false;
    }
    return true;
  });
}

function ellipsePath(cx,cy,rx,ry){
  return `M${cx-rx},${cy} A${rx},${ry} 0 1,0 ${cx+rx},${cy} A${rx},${ry} 0 1,0 ${cx-rx},${cy} Z`;
}
function shapePath(id){
  switch(id){
    case 'ovalo': return ellipsePath(80,100,72,98);
    case 'circulo': return ellipsePath(80,100,80,80);
    case 'diamante': return 'M80,0 L160,100 L80,200 L0,100 Z';
    case 'rombo_alargado': return 'M80,0 L128,100 L80,200 L32,100 Z';
    case 'puntas': return 'M8,0 L152,0 L152,145 L128,125 L104,160 L80,130 L56,160 L32,125 L8,145 Z';
    case 'polaco': return 'M10,0 L150,0 L150,155 L98,155 L98,140 L62,140 L62,155 L10,155 Z';
    case 'espanol': return 'M10,8 Q10,0 20,0 L140,0 Q150,0 150,8 L150,160 Q150,200 80,200 Q10,200 10,160 Z';
    default: return 'M10,18 Q10,0 32,0 L128,0 Q150,0 150,18 L150,112 Q150,172 80,200 Q10,172 10,112 Z';
  }
}

    case 'aspa': return `<line x1="0" y1="0" x2="160" y2="200" stroke="${hex}" stroke-width="30"/><line x1="160" y1="0" x2="0" y2="200" stroke="${hex}" stroke-width="30"/>`;
    case 'cabria': return `<polyline points="18,200 80,110 142,200" fill="none" stroke="${hex}" stroke-width="30" stroke-linejoin="round"/>`;
    case 'bordura': return `<path d="${shapePath(shapeId)}" fill="none" stroke="${hex}" stroke-width="18"/>`;
    default: return '';
  }
}
function starPoints(cx,cy,rOuter,rInner,points){
  const pts=[];
  for(let i=0;i<points*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const a = Math.PI/points*i - Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}
function starPath(cx,cy,rOuter,rInner,points,hex){
  return `<polygon points="${starPoints(cx,cy,rOuter,rInner,points)}" fill="${hex}"/>`;
}
function sunMarkup(cx,cy,r,hex){
  let rays='';
  for(let i=0;i<12;i++){
    const a = Math.PI/6*i;
    rays += `<line x1="${(cx+r*1.15*Math.cos(a)).toFixed(1)}" y1="${(cy+r*1.15*Math.sin(a)).toFixed(1)}" x2="${(cx+r*1.7*Math.cos(a)).toFixed(1)}" y2="${(cy+r*1.7*Math.sin(a)).toFixed(1)}" stroke="${hex}" stroke-width="5"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${hex}"/>${rays}`;
}
function fivePetalFlower(cx,cy,r,hex){
  let petals='';
  for(let i=0;i<5;i++){
    const a = (Math.PI*2/5)*i - Math.PI/2;
    const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    petals += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="12" ry="18" fill="${hex}" transform="rotate(${(a*180/Math.PI+90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return petals + `<circle cx="${cx}" cy="${cy}" r="8" fill="${hex}"/>`;
}
function wheatSprigs(cx, topY, bottomY, hex){
  let s='';
  for(let y=topY+6; y<bottomY-10; y+=10){
    s += `<path d="M${cx},${y} L${cx-14},${y-8} M${cx},${y} L${cx+14},${y-8}" stroke="${hex}" stroke-width="4"/>`;
  }
  return s;
}
function gearMarkup(cx,cy,r,hex){
  let teeth='';
  for(let i=0;i<8;i++) teeth += `<rect x="${cx-5}" y="${cy-r-9}" width="10" height="14" fill="${hex}" transform="rotate(${i*45} ${cx} ${cy})"/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${hex}"/>${teeth}<circle cx="${cx}" cy="${cy}" r="${r*0.4}" fill="none" stroke="#00000066" stroke-width="3"/>`;
}

/* ===================== selección restringida + randomCrest ===================== */
function esMetal(t){ return TINCTURES.metals.includes(t); }
function weightedPickFrom(list, weightMap, rng){
  const r0 = rng || Math.random;
  if(!weightMap) return list[Math.floor(r0()*list.length)];
  const weights = list.map(id => (weightMap[id] !== undefined ? weightMap[id] : 1));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = r0()*total;
  for(let i=0;i<list.length;i++){ r -= weights[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function tinturasLegales(contra, pool){
  const base = pool && pool.length ? pool : ALL_TINCTURES;
  if(!contra) return base;
  const leg = base.filter(t => esMetal(t) !== esMetal(contra));
  if(leg.length) return leg;
  return ALL_TINCTURES.filter(t => esMetal(t) !== esMetal(contra));
}
function pickTincture(contra, rng, pool){
  const leg = tinturasLegales(contra, pool);
  return leg[Math.floor((rng||Math.random)()*leg.length)];
}
function pickOne(list, rng){ return list[Math.floor((rng||Math.random)()*list.length)]; }
function anioFicticio(rng){ return String(1880 + Math.floor((rng||Math.random)()*120)); }

function randomCrest(paisCode, rng, opts){
  rng = rng || Math.random;
  opts = opts || {};
  const pais = paisPorCode(paisCode);
  const paletaPais = (opts.modo !== 'libre' && pais && pais.paletaBandera && pais.paletaBandera.length) ? pais.paletaBandera : null;
  let paleta = paletaPais;
  const { temaId, pesos } = pesarCatalogoPorTema(paisCode);
  const simbolos = cargasSugeridasPorPais(paisCode);
  let crest, intentos = 0;
  do {
    paleta = intentos < 6 ? paletaPais : null;
    const shapeId = weightedPickFrom(SHAPES, pesos && pesos.shapes, rng);
    let fieldPool = paleta || ALL_TINCTURES;
    if(opts.evitarCampo && opts.evitarCampo.length){
      const f = fieldPool.filter(t => !opts.evitarCampo.includes(t));
      fieldPool = f.length ? f : ALL_TINCTURES.filter(t => !opts.evitarCampo.includes(t));
    }
    const fieldTincture = pickOne(fieldPool, rng);

    const divisionId = weightedPickFrom(DIVISIONS, null, rng);
    const divisionTincture2 = divisionId !== 'ninguna' ? pickOne(paleta || ALL_TINCTURES, rng) : null;

    let ordinaryId = weightedPickFrom(ORDINARIES, pesos && pesos.ordinaries, rng);
    if(pesos && pesos.ordinaryForzadoNinguna) ordinaryId = 'ninguna';
    const ordinaryTincture = ordinaryId !== 'ninguna' ? pickTincture(fieldTincture, rng, paleta) : null;

    let chargeId;
    if(opts.carga) chargeId = opts.carga;
    else if(simbolos.length && rng() < 0.5) chargeId = pickOne(simbolos, rng).id;
    else chargeId = weightedPickFrom(CHARGES, pesos && pesos.charges, rng);
    const esNatural = !!CHARGE_NATURAL[chargeId];
    const contraCarga = ordinaryId !== 'ninguna' ? ordinaryTincture : fieldTincture;
    const chargeTincture = esNatural ? null : pickTincture(contraCarga, rng, paleta);

    const starsBase = (temaId === 'argentino_clasico' && pesos) ? (pesos.starsDefault || 0) : 0;
    const stars = Math.min(5, starsBase + Math.floor(rng()*3));
    const anio = rng() < 0.15 ? anioFicticio(rng) : null;
    const ornamento = (pesos && pesos.ornamentoForzado) || (rng() < 0.12 ? pickOne(['corona','laurel'], rng) : null);
    const ornamentoVariante = Math.floor(rng()*2);
    const ornamentoTincture = ornamento ? pickTincture(ordinaryId !== 'ninguna' ? ordinaryTincture : fieldTincture, rng) : null;
    const lema = ((pesos && pesos.lemaForzado) || rng() < 0.1) ? pickOne(LEMAS_INVENTADOS, rng) : null;

    crest = {
      pais: paisCode, tema: temaId, shapeId, fieldTincture, divisionId, divisionTincture2,
      ordinaryId, ordinaryTincture, chargeId, chargeTincture, naturalTincture: esNatural,
      stars, anio, ornamento, ornamentoVariante, ornamentoTincture, lema,
      ribbonStyle: Math.floor(rng()*RIBBON_STYLES),
    };
    intentos++;
  } while (matchesBloqueo(crest) && intentos < 10);
  crest.atrapadoEnBloqueo = matchesBloqueo(crest);
  return crest;
}

function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  const f = function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.estado = () => a | 0;   // permite guardar y retomar la secuencia exacta
  return f;
}

function generarJugador(rng, opts){
  opts = opts || {};

  const nombres = listaNombres(opts.paisCode), apellidos = listaApellidos(opts.paisCode);
  const nombre = nombres[Math.floor(rng()*nombres.length)];
  const apellido = apellidos[Math.floor(rng()*apellidos.length)];

  else if(opts.juvenil) edad = 17 + Math.floor(rng()*4);
  else edad = 19 + Math.floor(rng()*17);
  const base = opts.ratingBase !== undefined ? opts.ratingBase : 62;
  const spread = opts.ratingSpread !== undefined ? opts.ratingSpread : 12;
  let rating = Math.round(clamp(base + gauss(rng) * spread * 0.55 + (opts.juvenil ? -6 : 0), 38, 94));
  const rasgo = RASGOS[Math.floor(rng()*RASGOS.length)];
  return {
    nombre, apellido, nombreCompleto: nombre + ' ' + apellido,
    pos, edad, rating, rasgo, cualidad: opts.cualidad || null,

}

function asignarDorsal(plantel, jugador, rng){

    const slots = SLOTS.filter(s => s.pos === pos);
    const cand = plantel.filter(j => j.pos === pos).sort((a,b) => b.rating - a.rating);
    slots.forEach((s, i) => { t[s.id] = cand[i] ? cand[i].nombreCompleto : null; });
  });
  // si falta alguien en una posición, completar con los mejores libres
  const usados = new Set(Object.values(t).filter(Boolean));

  if(criterio === 'joven'){
    lista = plantel.filter(j => j.edad <= 22);
    if(!lista.length) lista = plantel.slice().sort((a,b) => a.edad - b.edad).slice(0, 4);
  } else if(criterio === 'figura'){
    let ord = plantel.slice().sort((a,b) => b.valor - a.valor);
    if(tit && tit.size && rng() < 0.75){
      const t = ord.filter(j => tit.has(j.nombreCompleto));
      if(t.length) ord = t;
    }
    return ord[0];
  } else if(criterio === 'conflictivo'){
    const pesos = plantel.map(j => (j.rasgo === 'Polémico' ? 3 : 1) * (j.cualidad === 'polemico' ? 2 : 1));
    const total = pesos.reduce((a,b) => a+b, 0);
    let r = rng() * total;
    for(let i = 0; i < plantel.length; i++){ r -= pesos[i]; if(r <= 0) return plantel[i]; }
    return plantel[plantel.length - 1];
  } else if(criterio && criterio.indexOf('cualidad:') === 0){
    const q = criterio.split(':')[1];
    lista = plantel.filter(j => q === '*' ? !!j.cualidad : j.cualidad === q);
    if(!lista.length) lista = plantel;
  }
  if(soloDeportivo && tit && tit.size && rng() < 0.75){
    const t = lista.filter(j => tit.has(j.nombreCompleto));
    if(t.length) lista = t;
  }
  return lista[Math.floor(rng() * lista.length)];
}

/* ---- mercado ---- */
function precioJugador(j){
  const mod = j.cualidad ? CUALIDADES[j.cualidad].mod : 0;
  return Math.max(5, Math.round(j.valor * (1 + mod)));
}
function generarCandidatosMercado(rng, club, n){
  const out = [];
  for(let i = 0; i < (n || 6); i++){
    const nivel = club.dif === 'facil' ? 70 : club.dif === 'medio' ? 66 : 62;
    const cualidad = rng() < 0.45 ? CUALIDAD_IDS[Math.floor(rng() * CUALIDAD_IDS.length)] : null;
    const j = generarJugador(rng, { paisCode: club.paisCode, ratingBase: nivel, ratingSpread: 22, cualidad });
    out.push(j);
  }
  return out;
}

/* ===== liga.js ===== */
/* ===================== Liga: rivales y tabla de posiciones ===================== */

const LIGA_N = 12;
const LIGA_PREFIJOS = ['Deportivo','Atlético','Unión','Sporting','Racing','Defensores de','Juventud','Estudiantes de','Real','Club Social','Municipal','Independiente'];
const LIGA_SUFIJOS = ['Norte','del Valle','Sur','del Puerto','Alto Verde','Las Palmas','Villa Real','San Telmo','del Río','La Cumbre','Monte Alto','Costa Azul','Santa Rosa','Los Andes','Punta Este','La Loma','Barrio Nuevo','Cerro Chico'];

function crearLiga(seed, nombreClub){
  const rng = mulberry32((seed ^ 0x51ED27) >>> 0);
  const usados = new Set([nombreClub]);
  const rivales = [];
  let guard = 0;
  while(rivales.length < LIGA_N - 1 && guard++ < 500){
    const n = LIGA_PREFIJOS[Math.floor(rng() * LIGA_PREFIJOS.length)] + ' ' + LIGA_SUFIJOS[Math.floor(rng() * LIGA_SUFIJOS.length)];
    if(usados.has(n)) continue;
    usados.add(n);
    const pts = Math.round(clamp(28 + gauss(rng) * 8, 8, 58));
    rivales.push({ nombre: n, pts });
  }
  return { rivales };
}

const PTS_BASE = 24, PTS_POR_RESULTADO = 2.2;
function puntosTuyos(resultado, progreso){
  return Math.max(0, Math.round(PTS_BASE * progreso + PTS_POR_RESULTADO * resultado));
}

/* progreso: 0..1 de la temporada. Devuelve filas ordenadas con posición. */
function tablaLiga(progreso){
  if(!state.liga) state.liga = crearLiga(state.seed, state.club.nombre);
  const p = clamp(progreso === undefined ? 1 : progreso, 0, 1);
  const filas = state.liga.rivales.map(r => ({ nombre: r.nombre, pts: Math.round(r.pts * p), yo: false }));
  filas.push({ nombre: state.club.nombre, pts: puntosTuyos(state.stats.resultado, p), yo: true });
  filas.sort((a, b) => b.pts - a.pts || (a.yo ? 1 : b.yo ? -1 : a.nombre.localeCompare(b.nombre)));
  filas.forEach((f, i) => { f.pos = i + 1; });
  return filas;
}
function progresoTemporada(){
  if(state.fin || state.idx >= state.eventos.length) return 1;
  return clamp(state.idx / state.eventos.length, 0, 1);
}
function miPuesto(progreso){ return tablaLiga(progreso).find(f => f.yo).pos; }
function zonaLiga(pos){
  if(pos === 1) return 'campeon';
  if(pos <= 3) return 'copa';
  if(pos >= LIGA_N - 1) return 'descenso';
  return 'medio';
}
const ZONA_TXT = {
  campeon: '🏆 Campeón',
  copa: '🥉 Zona de copa',
  medio: 'Mitad de tabla',
  descenso: '⚠ Zona de descenso',
};
function ordinal(n){ return n + 'º'; }

/* ===== juego.js ===== */
/* ===================== Motor del juego ===================== */

const NUM_EVENTOS = 13;
let POOL = [];
let state = null;
const ui = { screen:'inicio', tab:'facil', volverA:'evento', cfg:null, seed:null, slotAbierto:null, mercado:[], msg:null };

function bandera(code){
  if(!code || code.length !== 2) return '🏳';
  return String.fromCodePoint(...code.toUpperCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtCaja(n){ return '$' + Math.round(n).toLocaleString('es-AR') + 'k'; }
function signo(n){ return (n > 0 ? '+' : '') + Math.round(n); }

function inicializarPool(){
  if(typeof expandirPlantillas === 'function' && typeof PLANTILLAS_EVENTOS !== 'undefined') POOL = expandirPlantillas(PLANTILLAS_EVENTOS);
  return POOL.length;
}

/* ---------- sustitución de tokens ---------- */
function sustituirTexto(t, ctx){
  if(!t) return '';
  const j = ctx && ctx.jugador;
  const club = state ? state.club : null;
  return String(t)
    .replace(/\{JUGADOR\}/g, j ? j.nombreCompleto : 'un jugador')
    .replace(/\{JPOS\}/g, j ? POS_LABEL[j.pos].toLowerCase() : 'jugador')
    .replace(/\{JEDAD\}/g, j ? j.edad : '')
    .replace(/\{JRATING\}/g, j ? j.rating : '')
    .replace(/\{CUALIDAD\}/g, j && j.cualidad ? CUALIDADES[j.cualidad].label.toLowerCase() : 'jugador de peso')
    .replace(/\{CLUB\}/g, club ? club.nombre : 'el club')
    .replace(/\{CIUDAD\}/g, club && club.ciudad ? club.ciudad : 'la ciudad');
}

/* ---------- muestreo de eventos ---------- */
function baseId(e){ return String(e.id).split('#')[0]; }
function muestrearEventos(dif, rngEv){
  const pesos = DIFICULTAD_INFO[dif].pesos;
  const candidatos = POOL.filter(e => !e.requiere);
  const elegidos = [], usadosPlantilla = new Set(), usadosId = new Set();
  const total = NUM_EVENTOS + 6; // + reservas
  let guard = 0;
  while(elegidos.length < total && guard++ < 5000){
    const libres = candidatos.filter(e => !usadosId.has(e.id) && !usadosPlantilla.has(baseId(e)));
    if(!libres.length) break;
    const w = libres.map(e => (pesos[e.cat] || 1) * ((e.jugador && e.jugador.indexOf('cualidad:') === 0) ? 0.5 : 1));
    const tot = w.reduce((a,b) => a+b, 0);
    let r = rngEv() * tot, k = 0;
    for(; k < libres.length - 1; k++){ r -= w[k]; if(r <= 0) break; }
    const e = libres[k];
    elegidos.push(e); usadosId.add(e.id); usadosPlantilla.add(baseId(e));
  }
  return { eventos: elegidos.slice(0, NUM_EVENTOS), reservas: elegidos.slice(NUM_EVENTOS) };
}

/* ---------- partida ---------- */
function iniciarPartida(clubData, seed){
  const rng = mulberry32(seed >>> 0);
  const rngEv = mulberry32((seed ^ 0x9E3779B9) >>> 0);
  const plantel = generarPlantel(rng, clubData);
  const m = muestrearEventos(clubData.dif, rngEv);
  state = {
    seed, rng, rngEv,
    club: { nombre:clubData.nombre, ciudad:clubData.ciudad || '', paisCode:clubData.paisCode, dif:clubData.dif, crest:clubData.crest },
    stats: { vestuario: 55, ...clubData.stats },
    cajaInicial: clubData.stats.caja,
    plantel, titulares: formacionAutomatica(plantel),
    capitan: elegirCapitan(plantel),
    eventos: m.eventos, reservas: m.reservas, idx: 0,
    flags: {}, historial: [], ctx: null, resultado: null, fin: null,
    vendidos: [], ventas: 0, fichajes: 0, encadenados: 0, guardado: false,
    liga: crearLiga(seed, clubData.nombre),
  };
  state.club.crest = { ...clubData.crest, nombre: clubData.crest.nombre || null };
  ui.mercado = [];
  ui.slotAbierto = null;
  ui.screen = 'formacion';
  ui.volverA = 'presupuesto';
}

function probConPlantel(base){
  const avg = ratingTitulares(state.plantel, state.titulares);
  let p = base + (avg - 65) / 150;
  const tit = titularesComoJugadores(state.plantel, state.titulares);
  if(tit.some(j => j.cualidad === 'muro' || j.cualidad === 'inquebrantable')) p += 0.05;
  return clamp(p, 0.08, 0.92);
}

function eventoValido(ev){
  if(ev.cond === 'pocos_arqueros' && state.plantel.filter(j => j.pos === 'ARQ').length > 1) return false;
  if(ev.jugador === 'vendido' && !state.vendidos.length) return false;
  if(ev.jugador && ev.jugador.indexOf('cualidad:') === 0){
    const q = ev.jugador.split(':')[1];
    return state.plantel.some(j => q === '*' ? !!j.cualidad : j.cualidad === q);
  }
  return true;
}

function ctxParaEvento(ev){
  let jugador = null;
  const rng = state.rng;
  const k = ev.jugador;
  if(k === 'capitan') jugador = jugadorPorNombre(state.plantel, state.capitan);
  else if(k === 'vendido') jugador = state.vendidos[state.vendidos.length - 1] || null;
  else if(k && k.indexOf('fichaje:') === 0) jugador = generarJugador(rng, { paisCode:state.club.paisCode, ratingBase:68, ratingSpread:12, pos:k.split(':')[1] });
  else if(k === 'fichaje') jugador = generarJugador(rng, { paisCode:state.club.paisCode, ratingBase:72, ratingSpread:14 });
  else if(k === 'exJugador') jugador = generarJugador(rng, { paisCode:state.club.paisCode, ratingBase:55, ratingSpread:25, retirado:true });
  else if(k) jugador = elegirJugador(rng, state.plantel, k, state.titulares, ev.cat === 'deportivo');
  return { jugador, esNuevo: !!k && (k === 'vendido' || k === 'exJugador' || k.indexOf('fichaje') === 0) };
}

function eventoActual(){
  let ev = state.eventos[state.idx];
  let guard = 0;
  while(ev && !eventoValido(ev) && guard++ < 30){
    const rep = state.reservas.shift();
    if(!rep) break;
    state.eventos[state.idx] = rep;
    ev = rep;
  }
  return ev;
}

/* ---------- vestuario: si la opción no lo fija, se deriva de lo que hace ---------- */
function derivarVestuario(d, ev, op, r, ctx){
  const j = ctx.jugador, q = j && !ctx.esNuevo ? j.cualidad : null;
  const vende = op.vende || r.vende, ficha = op.ficha || r.ficha;
  let v = 0;
  if(ev.cat === 'deportivo') v += Math.round(d.resultado * 0.4);
  if(ev.cat === 'hinchada' && d.gestion > 2) v += 1;
  if(ev.cat === 'economico' && d.caja >= 60 && d.gestion <= 0) v -= 3;          // recorte de gastos
  if(ev.cat === 'economico' && d.caja <= -60 && d.resultado > 0) v += 2;        // inversión en el plantel
  if(vende && j && !ctx.esNuevo){
    const figura = j.rating >= 75 || q === 'idolo' || q === 'lider' || state.capitan === j.nombreCompleto;
    v -= figura ? 10 : 4;
  }
  if(ficha && ctx.esNuevo) v += 2;
  return v;
}

/* ---------- aplicar efecto (único punto donde pesan las cualidades) ---------- */
function aplicarOpcion(op, ev, ctx){
  const j = ctx.jugador;
  const q = j && !ctx.esNuevo ? j.cualidad : null;
  let r;
  if(op.azar){
    let pOk = op.azar.p;
    if(ev.cat === 'deportivo') pOk = clamp(pOk + (probConPlantel(0.5) - 0.5), 0.05, 0.95);
    let pMal = 1 - pOk;
    if(q === 'inquebrantable') pMal /= 2;
    if(q === 'fragil' && ev.cat === 'deportivo') pMal = Math.min(0.9, pMal * 2);
    pOk = 1 - pMal;
    r = state.rng() < pOk ? op.azar.ok : op.azar.mal;
  } else r = { d: op.d, msg: op.msg };
  const d = Object.assign({ gestion:0, prensa:0, resultado:0, caja:0 }, r.d || {});
  const notas = [];
  if(state.club.dif === 'facil'){            // un grande no perdona: lo malo pega 25% más
    if(d.gestion < 0) d.gestion = Math.round(d.gestion * 1.25);
    if(d.prensa < 0) d.prensa = Math.round(d.prensa * 1.25);
  }
  if(d.vestuario == null) d.vestuario = derivarVestuario(d, ev, op, r, ctx);
  if(ev.cat === 'deportivo'){
    if(state.stats.vestuario < 15){ d.resultado -= 4; notas.push('🔥 Vestuario en llamas: −4 al resultado'); }
    else if(state.stats.vestuario < 30){ d.resultado -= 2; notas.push('🧑‍🤝‍🧑 Vestuario roto: −2 al resultado'); }
    else if(state.stats.vestuario >= 75){ d.resultado += 2; notas.push('🧑‍🤝‍🧑 Vestuario unido: +2 al resultado'); }
  }
  const bueno = (d.gestion + d.prensa + d.resultado) > 0;
  if(q === 'cazagoles' && ev.cat === 'deportivo' && d.resultado > 0){ d.resultado = Math.round(d.resultado * 1.15); notas.push('⚡ Cazagoles: +15% al resultado'); }
  if(q === 'muro' && d.resultado < 0){ d.resultado = Math.round(d.resultado / 2); notas.push('🧱 Muro: la pérdida se reduce a la mitad'); }
  if(q === 'carismatico' && bueno){ d.prensa += 5; notas.push('🎤 Carismático: +5 a prensa'); }
  if(q === 'idolo' && ev.cat === 'hinchada' && bueno){ d.gestion += 8; notas.push('👑 Ídolo: +8 a gestión'); }
  if(q === 'revalorizable' && bueno){ j.valor = Math.round(j.valor * 1.2); notas.push('📈 Revalorizable: su valor subió 20%'); }
  if(q === 'lider'){ d.gestion += 2; notas.push('🤝 Líder silencioso: +2 a gestión'); }
  const vende = op.vende || r.vende, ficha = op.ficha || r.ficha;
  let vendioFigura = false;
  if(vende && j && !ctx.esNuevo){
    if(q === 'idolo'){ d.gestion -= 15; notas.push('👑 Vendiste a un Ídolo: −15 a gestión'); }
    state.vendidos.push(j); state.ventas++;
    if(j.rating >= 72 || q === 'idolo' || state.capitan === j.nombreCompleto) vendioFigura = true;
    state.plantel = state.plantel.filter(x => x !== j);
    Object.keys(state.titulares).forEach(s => { if(state.titulares[s] === j.nombreCompleto) state.titulares[s] = null; });
    if(state.capitan === j.nombreCompleto) state.capitan = elegirCapitan(state.plantel);
    if(!formacionCompleta(state.titulares)) state.titulares = formacionAutomatica(state.plantel);
    notas.push('🚪 ' + j.nombreCompleto + ' dejó el club');
  }
  if(ficha && j && ctx.esNuevo && state.plantel.length < 26){
    asignarDorsal(state.plantel, j, state.rng);
    state.plantel.push(j); state.fichajes++;
    state.vendidos = state.vendidos.filter(x => x !== j);
    notas.push('✍️ ' + j.nombreCompleto + ' se suma al plantel (#' + j.dorsal + ')');
  }
  if(state.idx >= 5){   // la presión de la expectativa crece en la segunda mitad
    const rf = state.stats.resultado + d.resultado, dif = state.club.dif;
    if(dif === 'facil' && rf < 0){ d.gestion -= 3; notas.push('📣 La tribuna de un grande no espera: −3 a gestión'); }
    else if(dif === 'medio' && rf < -6){ d.gestion -= 2; notas.push('📣 La tribuna se impacienta: −2 a gestión'); }
  }
  const antes = { ...state.stats };
  state.stats.gestion = clamp(state.stats.gestion + d.gestion, 0, 100);
  state.stats.prensa = clamp(state.stats.prensa + d.prensa, 0, 100);
  state.stats.resultado += d.resultado;
  state.stats.caja += d.caja;
  state.stats.vestuario = clamp(state.stats.vestuario + d.vestuario, 0, 100);
  const setea = op.setea || r.setea;
  if(setea) state.flags[setea] = true;
  return { d, setea, vendioFigura, msg: sustituirTexto(r.msg || '', ctx), notas, antes };
}

function elegirOpcion(i){
  const ev = eventoActual();
  const ctx = state.ctx;
  const op = ev.opciones[i];
  const res = aplicarOpcion(op, ev, ctx);
  const impacto = Math.abs(res.d.gestion) + Math.abs(res.d.prensa) + Math.abs(res.d.resultado) + Math.abs(res.d.caja) / 20;
  state.historial.push({ cat: ev.cat, cons: !!ev.requiere, titulo: sustituirTexto(ev.titulo, ctx), opcion: sustituirTexto(op.texto, ctx), d: res.d, impacto, msg: res.msg });
  state.resultado = res;
  if(ev.requiere) state.encadenados++;
  if(res.setea) insertarEncadenado(res.setea);
  else {
    const d = res.d;
    const autos = [
      ['vestuario_critico', state.stats.vestuario < 20],
      ['vestuario_roto', state.stats.vestuario < 30],
      ['vestuario_oro', state.stats.vestuario >= 85],
      ['vendio_figura', res.vendioFigura],
      ['recorte', ev.cat === 'economico' && d.caja >= 60 && d.gestion <= 0],
      ['prensa_enojada', ev.cat === 'mediatico' && d.prensa <= -5],
      ['racha', ev.cat === 'deportivo' && d.resultado >= 6],
    ];
    const a = autos.find(([f, cond]) => cond && !state.flags[f]);
    if(a){ state.flags[a[0]] = true; insertarEncadenado(a[0]); }
  }
  if(state.stats.gestion <= 0) state.fin = 'destituido';
  else if(state.stats.caja <= -250) state.fin = 'quiebra';
  else if(state.stats.vestuario <= 0) state.fin = 'motin';
  if(state.fin) borrarGuardado();
  ui.screen = 'resultado';
}
function insertarEncadenado(flag){
  const usados = new Set(state.eventos.map(e => e.id));
  const cand = POOL.filter(e => e.requiere === flag && !usados.has(e.id));
  if(!cand.length) return;
  const ev = cand[Math.floor(state.rngEv() * cand.length)];
  let pos = Math.min(state.idx + 3, state.eventos.length);
  while(pos < state.eventos.length && state.eventos[pos].requiere) pos++;
  if(pos < state.eventos.length) state.eventos[pos] = ev; else state.eventos.push(ev);
}
function siguienteEvento(){
  state.idx++;
  state.ctx = null;
  state.resultado = null;
  if(state.fin || state.idx >= state.eventos.length){ borrarGuardado(); ui.screen = 'diario'; return; }
  guardarPartida();
  ui.screen = 'evento';
}

/* ---------- veredicto / titulares ---------- */
const OBJETIVOS = {
  facil:   { texto:'Pelear el campeonato: resultado de +8 o más y gestión de 60 o más.', ok: s => s.resultado >= 8 && s.gestion >= 60 },
  medio:   { texto:'Clasificar a copa: resultado de +3 o más sin gastar más del 30% de la caja.', ok: (s, ci) => s.resultado >= 3 && s.caja >= ci * 0.7 },
  dificil: { texto:'Sobrevivir: evitar el descenso (resultado de −4 o más) y cerrar con caja positiva.', ok: s => s.resultado >= -4 && s.caja >= 0 },
};
function objetivo(){
  const o = OBJETIVOS[state.club.dif];
  return { texto: o.texto, cumplido: !!o.ok(state.stats, state.cajaInicial) };
}
function calcularScore(){
  const s = state.stats;
  const resNorm = clamp(50 + s.resultado, 0, 100);
  const cajaNorm = clamp(50 + (s.caja - state.cajaInicial) / Math.max(100, state.cajaInicial) * 50, 0, 100);
  return 0.28 * s.gestion + 0.15 * s.prensa + 0.3 * resNorm + 0.1 * cajaNorm + 0.17 * s.vestuario;
}
const VEREDICTOS = [
  { min:72, titulo:'Leyenda de la dirigencia', facil:'Gestión impecable, pero con este club era lo mínimo que se esperaba: no te alcanza para la estatua.', medio:'Una temporada redonda. Los socios piden que no te vayas nunca.', dificil:'Una hazaña. Con tan poco, lograste lo que nadie esperaba: te van a hacer un mural.' },
  { min:62, titulo:'Dirigente de respeto', facil:'Cumpliste. En un club así, cumplir es no hacer ruido, y no hiciste ruido.', medio:'Buena temporada con sus sombras. Seguís en pie y con crédito.', dificil:'Sobreviviste y encima con crédito. En tu categoría eso es una gran gestión.' },
  { min:46, titulo:'Mandato gris', facil:'Con este plantel y esta historia, un mandato gris es un fracaso silencioso.', medio:'Ni fu ni fa: la temporada pasa sin pena ni gloria.', dificil:'Gris pero entero. Para un club chico, no hundirse ya es un logro.' },
  { min:30, titulo:'Gestión cuestionada', facil:'Un desastre para un club de esta jerarquía. La prensa ya afila los lápices.', medio:'Errores de más y aciertos de menos. La asamblea se pone brava.', dificil:'Difícil de sostener, pero difícil el contexto también. Hay socios que te defienden.' },
  { min:-1, titulo:'Desastre institucional', facil:'Un desplome histórico. Se habla de tu gestión en los programas de archivo.', medio:'Te llevaste puesto al club. Se arma una comisión de crisis.', dificil:'Lo que se temía. Igual, con esa caja, pocos habrían hecho mucho mejor.' },
];
function veredicto(){
  let sc = calcularScore();
  sc += objetivo().cumplido ? 6 : -4;
  if(state.club.dif === 'dificil') sc += 12; else if(state.club.dif === 'medio') sc += 6; else sc -= 8;
  const v = VEREDICTOS.find(x => sc >= x.min) || VEREDICTOS[VEREDICTOS.length - 1];
  let extra = '';
  if(state.fin === 'destituido') extra = 'La hinchada perdió la confianza: te destituyeron antes de terminar la temporada.';
  if(state.fin === 'motin') extra = 'El plantel se declaró en rebeldía: sin vestuario no hay club que se sostenga.';
  if(state.fin === 'quiebra') extra = 'El club quebró con vos al mando: caja en rojo y sin salida.';
  const ob = objetivo();
  const pos = miPuesto(1);
  if(!state.fin){
    extra = (extra ? extra + ' ' : '') + (ob.cumplido ? 'Objetivo cumplido.' : 'Objetivo incumplido.');
    extra += ' Cerraste ' + ordinal(pos) + ' de ' + LIGA_N + (zonaLiga(pos) === 'descenso' ? ': el club desciende.' : zonaLiga(pos) === 'campeon' ? ': ¡campeón!' : '.');
  }
  return { titulo: state.fin ? 'Mandato interrumpido' : v.titulo, texto: v[state.club.dif], extra, score: Math.round(sc), puesto: pos };
}
function tresTitulares(){
  const top = state.historial.slice().sort((a,b) => b.impacto - a.impacto).slice(0, 3);
  const c = state.club.nombre;
  const buenos = [
    (t, o) => `${c}: ante «${t}», el dirigente eligió «${o}» y casi todos quedaron conformes`,
    (t, o) => `Aplausos en ${c}: «${o}» como respuesta a «${t}» sorprende para bien`,
    (t, o) => `Golpe de timón en ${c}: «${t}» se resuelve con «${o}» y cambia el clima`,
  ];
  const malos = [
    (t, o) => `Escándalo en ${c}: elegir «${o}» frente a «${t}» abre una grieta`,
    (t, o) => `Críticas feroces en ${c}: «${o}» no convence a nadie tras «${t}»`,
    (t, o) => `Mala hora para ${c}: la salida «${o}» en «${t}» sale cara`,
  ];
  const limpio = s => String(s).replace(/[.!?]+$/, '');
  return top.map((h, i) => {
    const suma = h.d.gestion + h.d.prensa + h.d.resultado + h.d.caja / 100;
    const lista = suma >= 0 ? buenos : malos;
    return { texto: lista[(hashStr(h.titulo) + i) % lista.length](limpio(h.titulo), limpio(h.opcion)), bueno: suma >= 0, cat: h.cat };
  });
}

/* ---------- escudos: ayudas de edición ---------- */
function iniciales(nombre){
  const w = String(nombre || '').split(/\s+/).filter(x => x.length > 2 || /^[A-ZÁÉÍÓÚ]/.test(x));
  const ini = w.map(x => x[0]).join('').slice(0,3).toUpperCase();
  return ini || 'CFM';
}
function normalizarTinturas(c){
  const pal = null;
  if(c.ordinaryId && c.ordinaryId !== 'ninguna'){
    if(!c.ordinaryTincture || esMetal(c.ordinaryTincture) === esMetal(c.fieldTincture)) c.ordinaryTincture = pickTincture(c.fieldTincture, () => 0.5, pal);
  } else c.ordinaryTincture = null;
  const contra = (c.ordinaryId && c.ordinaryId !== 'ninguna') ? c.ordinaryTincture : c.fieldTincture;
  if(CHARGE_NATURAL[c.chargeId]) c.chargeTincture = null;
  else if(!c.chargeTincture || esMetal(c.chargeTincture) === esMetal(contra)) c.chargeTincture = pickTincture(contra, () => 0.5, pal);
  if(c.divisionId === 'ninguna') c.divisionTincture2 = null;
  else if(!c.divisionTincture2) c.divisionTincture2 = ALL_TINCTURES.find(t => t !== c.fieldTincture);
  if(c.ornamento){ if(!c.ornamentoTincture || esMetal(c.ornamentoTincture) === esMetal(contra)) c.ornamentoTincture = pickTincture(contra, () => 0.5, pal); }
  else c.ornamentoTincture = null;
  return c;
}
function aplicarPaletaPais(c, code){
  const p = paisPorCode(code);
  if(!p) return c;
  const pal = p.paletaBandera;
  c.fieldTincture = pal[0];
  if(c.ordinaryId !== 'ninguna') c.ordinaryTincture = pickTincture(c.fieldTincture, () => 0.5, pal);
  c.chargeTincture = null;
  c.divisionTincture2 = c.divisionId !== 'ninguna' ? (pal[1] || null) : null;
  c.ornamentoTincture = null;
  return normalizarTinturas(c);
}
function nuevoCfg(){
  const pais = 'AR';

  return { pais, modo:'pais', nombre:'', ciudad:'', dif:'medio', crest, tabCarga:'tipicas', busqueda:'', aviso:false };
}
function crestDelCfg(){
  const c = { ...ui.cfg.crest };
  c.monograma = iniciales(ui.cfg.nombre);
  if(c.cinta === 'nombre') c.nombre = ui.cfg.nombre || null;

}

function logros(){
  const s = state.stats, fin = state.fin, L = [];
  if(fin) L.push(['💥', 'Caído en combate', 'Tu mandato no llegó al final de la temporada.']);
  if(state.fichajes >= 3) L.push(['💸', 'Comprador compulsivo', 'Sumaste a 3 o más jugadores.']);
  if(!fin && state.fichajes === 0) L.push(['🧊', 'Mercado congelado', 'Terminaste sin un solo fichaje.']);
  if(state.ventas >= 3) L.push(['🏷', 'El que vendió todo', 'Vendiste a 3 o más jugadores.']);
  if(!fin && s.vestuario >= 80) L.push(['🧑‍🤝‍🧑', 'Vestuario de oro', 'Cerraste con el plantel en la palma de la mano.']);
  if(!fin && s.prensa >= 80) L.push(['📰', 'Prensa en el bolsillo', 'Prensa a 80 o más.']);
  if(!fin && state.cajaInicial > 0 && s.caja >= state.cajaInicial * 1.25) L.push(['🏦', 'Caja de hierro', 'Cerraste con 25% más de caja que al empezar.']);
  if(!fin && s.gestion < 35) L.push(['🧗', 'Sobreviviente', 'Llegaste al final con la gestión por el piso.']);
  if(!fin && Math.min(s.gestion, s.prensa, s.vestuario) >= 55) L.push(['⚖️', 'Equilibrista', 'Gestión, prensa y vestuario por encima de 55.']);
  if(!fin && objetivo().cumplido) L.push(['🎯', 'Objetivo cumplido', 'Lograste la meta de la temporada.']);
  if(!fin && miPuesto(1) === 1) L.push(['🏆', 'Campeón', 'Terminaste primero en la tabla.']);
  if(!fin && zonaLiga(miPuesto(1)) === 'descenso') L.push(['🕳', 'Descenso', 'El club cerró en zona de descenso.']);
  if(state.encadenados >= 3) L.push(['🎲', 'Efecto dominó', 'Tus decisiones volvieron a buscarte 3 veces o más.']);
  return L;
}

function leerHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){ return []; } }
function guardarHist(){
  if(!state || state.guardado) return;

const SFX = { on: (() => { try{ return localStorage.getItem('vd_mute') !== '1'; }catch(e){ return true; } })(), ctx: null };
function toggleSonido(){ SFX.on = !SFX.on; try{ localStorage.setItem('vd_mute', SFX.on ? '0' : '1'); }catch(e){} }
function feedback(bueno){
  try{ if(navigator.vibrate) navigator.vibrate(bueno ? 20 : [30, 40, 30]); }catch(e){}
  if(!SFX.on) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    SFX.ctx = SFX.ctx || new AC();
    (bueno ? [523, 659] : [220, 165]).forEach((f, i) => {
      const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain(), t = SFX.ctx.currentTime + i * 0.11;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(SFX.ctx.destination); o.start(t); o.stop(t + 0.2);
    });
  }catch(e){}
}

const SAVE_KEY = 'vd_save_v1';
function guardarPartida(){
  if(!state || state.fin) return;
  try{
    const s = Object.assign({}, state, { rng: state.rng.estado(), rngEv: state.rngEv.estado(), ctx: null, resultado: null });
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, f: Date.now(), state: s }));
  }catch(e){}
}
function hayGuardado(){
  try{ const g = JSON.parse(localStorage.getItem(SAVE_KEY)); return g && g.v === 1 && g.state && g.state.club ? g : null; }catch(e){ return null; }
}
function borrarGuardado(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function cargarPartida(){
  const g = hayGuardado();
  if(!g) return false;
  const s = g.state;
  s.rng = mulberry32(s.rng); s.rngEv = mulberry32(s.rngEv);
  state = s; ui.mercado = []; ui.slotAbierto = null; ui.screen = 'evento'; ui.volverA = 'evento';

}

    <button class="btn primary" data-act="confirmarFormacion" ${ok ? '' : 'disabled'}>${ui.volverA === 'evento' ? 'Guardar formación' : 'Confirmar formación'}</button>
  </div>`;
}
function pantallaPresupuesto(){
  return `<div class="screen center">
    <h2>Presupuesto de la temporada</h2>
    <div class="big">${fmtCaja(state.stats.caja)}</div>
    <div class="nota">🎯 Objetivo: ${esc(objetivo().texto)}</div>
    <p class="mut">Con esta plata sostenés sueldos, fichajes e imprevistos durante toda la temporada. Si la caja se hunde, el club corre riesgo de quiebra.</p>
    <button class="btn" data-act="irMercado">🛒 Ir al mercado antes de arrancar</button>
    <button class="btn" data-act="irPlantel">👥 Ver plantel</button>
    <button class="btn primary" data-act="arrancar">Arrancar temporada</button>
  </div>`;
}

/* ---------- plantel / mercado ---------- */
function filaJugador(j, extra){
  const tit = Object.values(state.titulares).includes(j.nombreCompleto);
  return `<div class="club-card static">${playerChip(j, `<div class="tags">${state.capitan === j.nombreCompleto ? '<span class="badge">C</span>' : ''}${tit ? '<span class="badge on">XI</span>' : ''}</div>`)}${extra || ''}</div>`;
}
function pantallaPlantel(){
  const lista = state.plantel.slice().sort((a,b) => ['ARQ','DEF','MED','DEL'].indexOf(a.pos) - ['ARQ','DEF','MED','DEL'].indexOf(b.pos) || b.rating - a.rating);
  return `<div class="screen">${hud()}<div class="top"><button class="btn ghost sm" data-act="volver">← Volver</button><h2>Plantel (${lista.length})</h2></div>
    <div class="list">${lista.map(j => filaJugador(j)).join('')}</div></div>`;
}
function pantallaMercado(){
  if(!ui.mercado.length) ui.mercado = generarCandidatosMercado(state.rng, state.club, 6);
  const lleno = state.plantel.length >= 26;
  const items = ui.mercado.map((j, i) => {
    const precio = precioJugador(j);
    const puede = state.stats.caja >= precio && !lleno;
    return `<div class="club-card static ${puede ? '' : 'dim'}">${playerChip(j)}<div class="buy"><b>${fmtCaja(precio)}</b><button class="btn sm primary" data-act="comprar" data-v="${i}" ${puede ? '' : 'disabled'}>Comprar</button></div>
      ${j.cualidad ? `<div class="mut">${CUALIDADES[j.cualidad].desc}</div>` : ''}</div>`;
  }).join('');
  return `<div class="screen">${hud()}<div class="top"><button class="btn ghost sm" data-act="volver">← Volver</button><h2>Mercado de pases</h2></div>
    <p class="mut">${lleno ? 'Plantel lleno (26).' : 'Los jugadores con cualidad pesan en las decisiones, pero cuestan más.'}</p>
    <div class="list">${items || '<p class="mut">Sin candidatos.</p>'}</div>
    <button class="btn" data-act="actualizarMercado">🔄 Actualizar candidatos</button></div>`;
}

/* ---------- evento / resultado ---------- */
const CAT_LABEL = { deportivo:'⚽ Deportivo', economico:'💰 Económico', institucional:'🏛 Institucional', mediatico:'📰 Mediático', hinchada:'📣 Hinchada' };
function tagsOpcion(o){
  const t = [];
  if(o.azar) t.push('🎲 Riesgo');
  if(o.vende) t.push('🚪 Sale un jugador');
  if(o.ficha) t.push('✍️ Llega un jugador');
  return t.length ? ' ' + t.map(x => `<em class="tag">${x}</em>`).join('') : '';
}
function pantallaEvento(){
  const ev = eventoActual();
  if(!state.ctx) state.ctx = ctxParaEvento(ev);
  const ctx = state.ctx;
  return `<div class="screen">${hud()}
    <div class="progress"><div style="width:${(state.idx / state.eventos.length) * 100}%"></div></div>
    <div class="mut center">Evento ${state.idx + 1} de ${state.eventos.length} · ${CAT_LABEL[ev.cat] || ev.cat} · 🎯 ${objetivo().cumplido ? 'objetivo en camino' : 'objetivo en riesgo'} · 📊 ${ordinal(miPuesto(progresoTemporada()))}</div>
    <h2>${esc(sustituirTexto(ev.titulo, ctx))}</h2>
    ${playerChip(ctx.jugador)}
    <p class="ctx">${esc(sustituirTexto(ev.contexto, ctx))}</p>
    <div class="list">${ev.opciones.map((o, i) => `<button class="opt" data-act="opcion" data-v="${i}"><b>${esc(sustituirTexto(o.texto, ctx))}</b><span>${esc(sustituirTexto(o.sub || '', ctx))}${tagsOpcion(o)}</span></button>`).join('')}</div>
    <div class="row4"><button class="btn ghost sm" data-act="irPlantel">👥 Plantel</button><button class="btn ghost sm" data-act="irMercado">🛒 Mercado</button><button class="btn ghost sm" data-act="irFormacion">📋 Formación</button><button class="btn ghost sm" data-act="irTabla">📊 Tabla</button></div>
  </div>`;
}
function tablaHtml(p){
  const filas = tablaLiga(p);
  return `<div class="tabla">${filas.map(f => `<div class="trow ${f.yo ? 'yo' : ''} ${zonaLiga(f.pos)}"><span class="tp">${f.pos}</span><span class="tn">${esc(f.nombre)}</span><b>${f.pts}</b></div>`).join('')}</div>
    <div class="mut center">🏆 1º · 🥉 2º-3º zona de copa · ⚠ 11º-12º descienden</div>`;
}
function pantallaTabla(){
  const p = progresoTemporada(), pos = miPuesto(p);
  return `<div class="screen">${hud()}<div class="top"><button class="btn ghost sm" data-act="volver">← Volver</button><h2>Tabla de posiciones</h2></div>
    <p class="mut">Fecha ${Math.max(1, Math.round(p * (LIGA_N - 1) * 2))} de ${(LIGA_N - 1) * 2}. Vas ${ordinal(pos)}: ${ZONA_TXT[zonaLiga(pos)]}. Tus puntos dependen del resultado deportivo que acumulás.</p>
    ${tablaHtml(p)}</div>`;
}
function pantallaResultado(){
  const r = state.resultado, d = r.d;
  const h = state.historial[state.historial.length - 1];
  const hinchada = d.gestion > 2 ? ['😀','Hinchada contenta'] : d.gestion < -2 ? ['😠','Hinchada enojada'] : ['😐','Hinchada expectante'];
  const prensa = d.prensa > 2 ? ['👍','Prensa favorable'] : d.prensa < -2 ? ['👎','Prensa hostil'] : ['📄','Prensa neutral'];
  const warn = state.stats.caja < 0 ? '<div class="aviso show">⚠ La caja está en rojo.</div>' : '';
  return `<div class="screen" id="pantallaResultado">${hud()}
    <div class="reac"><div><span>${hinchada[0]}</span><small>${hinchada[1]}</small></div><div><span>${prensa[0]}</span><small>${prensa[1]}</small></div></div>
    <p class="ctx">${esc(r.msg)}</p>
    <div class="chips">${chipDelta('gestion', d.gestion)}${chipDelta('prensa', d.prensa)}${chipDelta('resultado', d.resultado)}${chipDelta('caja', d.caja)}${chipDelta('vestuario', d.vestuario)}</div>
    ${r.notas.map(n => `<div class="nota">${esc(n)}</div>`).join('')}${warn}
    ${state.fin ? `<div class="aviso show">${state.fin === 'destituido' ? 'La gestión llegó a 0: te destituyen.' : state.fin === 'motin' ? 'El vestuario llegó a 0: el plantel se te rebeló.' : 'La caja se hundió: el club quiebra.'}</div>` : ''}
    <button class="btn primary" data-act="siguiente">${state.fin || state.idx + 1 >= state.eventos.length ? 'Ver el cierre' : 'Siguiente'}</button>
  </div>`;
}

/* ---------- cierre ---------- */
function pantallaDiario(){
  const t = tresTitulares();
  return `<div class="screen"><div class="diario"><div class="cab">LA GACETA DEL DIRIGENTE</div>
    ${t.map(x => `<div class="tit ${x.bueno ? 'bien' : 'mal'}"><span>${x.bueno ? '▲' : '▼'}</span> ${esc(x.texto)}</div>`).join('') || '<div class="tit">Temporada sin sobresaltos.</div>'}</div>
    <button class="btn primary" data-act="irFinal">Ver mi veredicto</button></div>`;
}
function pantallaFinal(){
  const v = veredicto(), s = state.stats;
  return `<div class="screen center">
    ${crestSvg(state.club.crest, 'lg')}
    <h2>${esc(state.club.nombre)}</h2><div class="mut">${bandera(state.club.paisCode)} ${DIFICULTAD_INFO[state.club.dif].label}</div>
    <h1 class="verd">${esc(v.titulo)}</h1>
    <p>${esc(v.texto)}</p>${v.extra ? `<p class="mut">${esc(v.extra)}</p>` : ''}
    <div class="final-stats"><div><b>${signo(s.resultado)}</b><small>Resultado</small></div><div><b>${Math.round(s.gestion)}</b><small>Gestión</small></div><div><b>${Math.round(s.prensa)}</b><small>Prensa</small></div><div><b>${fmtCaja(s.caja)}</b><small>Caja</small></div><div><b>${Math.round(s.vestuario)}</b><small>Vestuario</small></div></div>
    <div class="nota">🎯 ${esc(objetivo().texto)} <b>${state.fin ? 'No cumplido' : objetivo().cumplido ? 'Cumplido ✔' : 'No cumplido ✘'}</b></div>
    <h3 class="sub">Tabla final</h3>${tablaHtml(1)}
    ${logrosHtml()}
    <button class="btn primary" data-act="compartir">📤 Compartir mi gestión</button>
    <button class="btn" data-act="descargarTarjeta">⬇ Descargar tarjeta</button>
    <button class="btn" data-act="irInicio">Jugar de nuevo</button>
    ${disclaimer()}</div>`;
}

function logrosHtml(){
  const L = logros();
  if(!L.length) return '';
  return `<div class="logros">${L.map(([ic, t, d]) => `<div class="logro"><span>${ic}</span><div><b>${esc(t)}</b><small>${esc(d)}</small></div></div>`).join('')}</div>`;
}
function historialHtml(){
  const h = leerHist();
  if(!h.length) return '';
  const mejor = h.reduce((a, b) => (b.score > a.score ? b : a), h[0]);
  return `<div class="hist"><b>Tus últimas gestiones</b>
    ${h.slice(0, 5).map(x => `<div class="hrow"><span>${esc(x.club)}</span><span class="mut">${esc(x.titulo)} · ${x.score}</span></div>`).join('')}
    <div class="mut">Mejor: ${esc(mejor.club)} (${mejor.score})</div></div>`;
}

const PANTALLAS = {
  inicio: pantallaInicio, elegir: pantallaElegir, crear: pantallaCrear, formacion: pantallaFormacion,
  presupuesto: pantallaPresupuesto, plantel: pantallaPlantel, mercado: pantallaMercado,
  evento: pantallaEvento, resultado: pantallaResultado, diario: pantallaDiario, final: pantallaFinal, tabla: pantallaTabla,
};
function render(){
  app.innerHTML = PANTALLAS[ui.screen]();
  window.scrollTo(0, 0);
  if(ui.screen === 'resultado' && state && state.resultado) flashHud(state.resultado.antes);
}
function descargarTarjeta(){
  tarjetaCanvas(cv => {
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png'); a.download = 'volvete-dirigente.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
}
function compartir(el){
  const v = veredicto();
  const url = urlDelJuego();
  const texto = `Mi gestión en ${state.club.nombre}: «${v.titulo}» (${v.score}/100)` + (state.fin ? '' : `, cerré ${ordinal(v.puesto)} de ${LIGA_N}`) + `. ¿Podés superarme?` + (url ? ' ' + url : '');
  const copiar = () => { try{ navigator.clipboard.writeText(texto); el.textContent = '✔ Copiado'; }catch(e){ el.textContent = texto; } };
  if(!navigator.share){ copiar(); return; }
  tarjetaCanvas(cv => cv.toBlob(blob => {
    const file = blob ? new File([blob], 'volvete-dirigente.png', { type:'image/png' }) : null;
    const data = file && navigator.canShare && navigator.canShare({ files:[file] }) ? { text:texto, files:[file] } : { text:texto };
    navigator.share(data).catch(() => {});
  }, 'image/png'));
}
function refrescarPreviewCrear(){
  const p = document.querySelector('.preview');
  if(p){
    const av = document.getElementById('avisoBloqueo');
    p.innerHTML = crestSvg(crestDelCfg(), 'lg') + `<div id="avisoBloqueo" class="aviso ${ui.cfg.aviso ? 'show' : ''}">${av ? av.innerHTML : ''}</div>`;
  }
}

/* ---------- tarjeta descargable ---------- */
function urlDelJuego(){
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/index\.html$|volvete-dirigente\.html$/, '') : '';
}
function lineasAjustadas(g, texto, maxW){
  const out = []; let linea = '';
  texto.split(' ').forEach(w => {
    const t = linea ? linea + ' ' + w : w;
    if(g.measureText(t).width > maxW && linea){ out.push(linea); linea = w; } else linea = t;
  });
  if(linea) out.push(linea);
  return out;
}
function tarjetaCanvas(cb){
  const v = veredicto(), s = state.stats, c = state.club, ob = objetivo();
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#171b22'); grad.addColorStop(1, '#0b0e13');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#d8b45a'; g.lineWidth = 6; g.strokeRect(30, 30, W - 60, H - 60);
  g.textAlign = 'center';
  const txt = (t, y, size, color, w) => { g.fillStyle = color; g.font = (w || '700') + ' ' + size + 'px Georgia, serif'; g.fillText(t, W/2, y); };
  txt('VOLVETE DIRIGENTE', 100, 40, '#d8b45a', '900');
  const svg = buildCrestSVG(c.crest).replace('<svg ', '<svg width="330" height="528" ');
  const img = new Image();
  img.onload = () => {
    g.drawImage(img, W/2 - 165, 125, 330, 528);
    txt(c.nombre, 718, 58, '#e8e4d8', '900');
    txt(DIFICULTAD_INFO[c.dif].label + ' · ' + ((paisPorCode(c.paisCode) || {}).nombre || ''), 762, 30, '#9aa3b2', '400');
    txt(v.titulo, 830, 50, '#d8b45a', '900');
    const pos = v.puesto, zona = state.fin ? 'Mandato interrumpido' : ZONA_TXT[zonaLiga(pos)];
    txt((state.fin ? '' : 'Cerré ' + ordinal(pos) + ' de ' + LIGA_N + ' · ') + zona, 880, 32, '#e8e4d8', '700');
    txt('🎯 ' + (state.fin || !ob.cumplido ? 'Objetivo incumplido' : 'Objetivo cumplido') + ' · Puntaje ' + v.score + '/100', 926, 30, state.fin || !ob.cumplido ? '#e5534b' : '#3ddc84', '700');
    const stats = [['Resultado', signo(s.resultado)], ['Gestión', Math.round(s.gestion)], ['Prensa', Math.round(s.prensa)], ['Caja', fmtCaja(s.caja)], ['Vestuario', Math.round(s.vestuario)]];
    stats.forEach(([k, val], i) => {
      const x = 140 + i * 200;
      g.fillStyle = '#e8e4d8'; g.font = '900 44px Georgia'; g.fillText(String(val), x, 1002);
      g.fillStyle = '#9aa3b2'; g.font = '400 24px Georgia'; g.fillText(k, x, 1036);
    });
    g.textAlign = 'left';
    let y = 1096;
    tresTitulares().slice(0, 2).forEach(t => {
      g.font = '700 27px Georgia'; g.fillStyle = t.bueno ? '#7ddf9c' : '#f08a84';
      lineasAjustadas(g, (t.bueno ? '▲ ' : '▼ ') + t.texto, W - 160).slice(0, 2).forEach(l => { g.fillText(l, 80, y); y += 34; });
      y += 8;
    });
    g.textAlign = 'center';
    const url = urlDelJuego();
    txt('¿Podés superarme? Jugá y compará tu gestión', 1262, 30, '#d8b45a', '700');
    txt(url ? url.replace(/^https?:\/\//, '') : 'Volvete Dirigente · Juego de ficción no oficial', 1300, 24, '#9aa3b2', '400');
    cb(cv);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- eventos de UI ---------- */
function setCrest(fn){ fn(ui.cfg.crest); normalizarTinturas(ui.cfg.crest); ui.cfg.aviso = false; render(); }
function onAct(act, v, el){
  switch(act){
    case 'irInicio': ui.screen = 'inicio'; break;
    case 'irElegir': ui.screen = 'elegir'; break;
    case 'irCrear': ui.cfg = ui.cfg || nuevoCfg(); ui.cfg.crest.cinta = ui.cfg.crest.cinta || (ui.cfg.crest.lema ? 'lema' : 'ninguna'); ui.screen = 'crear'; break;
    case 'tab': ui.tab = v; break;
    case 'elegirClub': {
      const c = CLUBES[Number(v)];
      iniciarPartida({ nombre:c.nombre, ciudad:'', paisCode:c.paisCode, dif:c.dif, stats:c.stats, crest:c.crest }, leerSeed());
      break; }
    case 'sorprender': {
      const cinta = ui.cfg.crest.cinta;
      ui.cfg.crest = randomCrest(ui.cfg.pais, Math.random, { modo: ui.cfg.modo });
      ui.cfg.crest.cinta = ui.cfg.crest.lema ? 'lema' : (cinta || 'ninguna');
      ui.cfg.aviso = false; break; }
    case 'pais': {
      ui.cfg.pais = v;
      if(ui.cfg.modo === 'pais') aplicarPaletaPais(ui.cfg.crest, v);
      ui.cfg.tabCarga = cargasSugeridasPorPais(v).length ? 'tipicas' : 'gen';
      ui.cfg.aviso = false; break; }
    case 'modo':
      ui.cfg.modo = v;
      if(v === 'pais') aplicarPaletaPais(ui.cfg.crest, ui.cfg.pais);
      break;
    case 'forma': ui.cfg.crest.shapeId = v; ui.cfg.aviso = false; break;
    case 'tint': setCrest(c => { c[el.dataset.k] = v; if(el.dataset.k === 'fieldTincture'){ c.ordinaryTincture = c.ordinaryTincture; } }); return;
    case 'carga': setCrest(c => { c.chargeId = v; if(CHARGE_NATURAL[v]) c.chargeTincture = null; }); return;
    case 'tabCarga': ui.cfg.tabCarga = v; break;
    case 'difCfg': ui.cfg.dif = v; break;
    case 'confirmarClub': {
      const cr = crestDelCfg();
      if(matchesBloqueo(cr)){ ui.cfg.aviso = true; break; }
      iniciarPartida({ nombre: ui.cfg.nombre.trim(), ciudad: ui.cfg.ciudad.trim(), paisCode: ui.cfg.pais, dif: ui.cfg.dif,
        stats: statsIniciales(ui.cfg.dif, mulberry32(hashStr(ui.cfg.nombre))), crest: { ...cr, nombre: cr.nombre || null } }, leerSeed());
      break; }
    case 'slot': ui.slotAbierto = ui.slotAbierto === v ? null : v; break;
    case 'asignar': {
      const nc = v;
      Object.keys(state.titulares).forEach(k => { if(state.titulares[k] === nc) state.titulares[k] = null; });
      state.titulares[ui.slotAbierto] = nc; ui.slotAbierto = null; break; }
    case 'quitarSlot': state.titulares[ui.slotAbierto] = null; ui.slotAbierto = null; break;
    case 'autoFormacion': state.titulares = formacionAutomatica(state.plantel); ui.slotAbierto = null; break;
    case 'confirmarFormacion': ui.slotAbierto = null; ui.screen = ui.volverA; if(ui.volverA === 'evento') {} break;
    case 'irMercado': ui.volverA = ui.screen === 'presupuesto' ? 'presupuesto' : 'evento'; ui.screen = 'mercado'; break;
    case 'irPlantel': ui.volverA = ui.screen === 'presupuesto' ? 'presupuesto' : 'evento'; ui.screen = 'plantel'; break;
    case 'irFormacion': ui.volverA = 'evento'; ui.screen = 'formacion'; break;
    case 'irTabla': ui.volverA = 'evento'; ui.screen = 'tabla'; break;
    case 'volver': ui.screen = ui.volverA; break;
    case 'comprar': {
      const j = ui.mercado[Number(v)];
      const precio = precioJugador(j);
      if(!j || state.stats.caja < precio || state.plantel.length >= 26) break;
      state.stats.caja -= precio;
      asignarDorsal(state.plantel, j, state.rng);
      state.plantel.push(j); state.fichajes++;
      ui.mercado.splice(Number(v), 1);
      break; }
    case 'actualizarMercado': ui.mercado = generarCandidatosMercado(state.rng, state.club, 6); break;
    case 'arrancar': guardarPartida(); ui.screen = 'evento'; ui.volverA = 'evento'; break;
    case 'continuar': cargarPartida(); break;
    case 'opcion': elegirOpcion(Number(v)); { const r = state.resultado.d; feedback((r.gestion + r.prensa + r.resultado + r.vestuario) >= 0); } break;
    case 'siguiente': siguienteEvento(); break;
    case 'irFinal': guardarHist(); ui.screen = 'final'; break;
    case 'toggleSonido': toggleSonido(); break;
    case 'compartir': compartir(el); return;
    case 'descargarTarjeta': descargarTarjeta(); return;
  }
  render();
}
function leerSeed(){
  // cada partida usa una semilla aleatoria
  const n = Number(String(ui.seed || '').replace(/\D/g, ''));
  ui.seed = null;
  return n > 0 ? n : Math.floor(Math.random() * 1e9);
}
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  onAct(el.dataset.act, el.dataset.v, el);
});
app.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in;
  if(!k) return;
  if(k === 'busqueda'){ ui.cfg.busqueda = el.value; document.getElementById('listaPaises').innerHTML = listaPaises(); return; }
  if(k === 'nombre'){ ui.cfg.nombre = el.value; ui.cfg.aviso = false; const b = document.getElementById('btnConfirmarClub'); if(b) b.disabled = el.value.trim().length < 2; refrescarPreviewCrear(); return; }
  if(k === 'ciudad'){ ui.cfg.ciudad = el.value; return; }
  if(k === 'anio'){ ui.cfg.crest.anio = /^\d{4}$/.test(el.value.trim()) ? el.value.trim() : null; ui.cfg.aviso = false; refrescarPreviewCrear(); return; }
  if(k === 'sel'){
    const key = el.dataset.k, c = ui.cfg.crest;
    let val = el.value;
    if(['stars','ribbonStyle'].includes(key)) val = Number(val);
    if(key === 'ornamento') val = val || null;
    c[key] = val;
    normalizarTinturas(c);
    ui.cfg.aviso = false;
    render();
  }
});

/* ---------- arranque ---------- */
(function arranque(){
  inicializarPool();
  render();
})();

</script>
